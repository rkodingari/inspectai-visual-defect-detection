[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectai"
version = "0.1.0"
description = "Laptop-friendly visual defect detection portfolio project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "pandas>=2.1",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "streamlit>=1.31",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "jupyter>=1.0"]

[project.scripts]
inspectai-prepare = "inspectai.data.prepare:main"
inspectai-train = "inspectai.training.train:main"
inspectai-train-all = "inspectai.training.train_all:main"
inspectai-evaluate = "inspectai.evaluation.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
